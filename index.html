<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite V — Spatial VR Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        canvas {
            object-fit: cover;
        }
    </style>
</head>

<body class="bg-black text-white selection:bg-orange-500 selection:text-black">

    <!-- 1. FIRST SCROLL ANIMATION & FOREGROUND CONTENT -->
    <div id="animation-container" class="relative" style="height: 260vh;">
        <!-- Sticky Background Canvas -->
        <div class="sticky top-0 left-0 w-full h-screen z-0 pointer-events-none">
            <canvas id="scroll-canvas" class="w-full h-full"></canvas>
        </div>

        <!-- Foreground Content Layer -->
        <div class="relative z-10 w-full flex flex-col justify-between" style="min-height: 260vh; margin-top: -100vh;">
            <div class="w-full flex flex-col">
                <div data-include="components/navbar.html"></div>
                <div data-include="components/hero.html"></div>
            </div>
            <div data-include="components/features-one.html"></div>
            <div data-include="components/milestones.html"></div>
        </div>
    </div>

    <!-- 2. MODULAR HARDWARE & SUBSCRIPTION TIERS -->
    <div data-include="components/pricing.html"></div>

    <!-- 3. SECOND SCROLL ANIMATION & HARDWARE TEARDOWN -->
    <div id="animation-container-2" class="relative" style="min-height: 180vh;">
        <!-- Sticky Background Canvas -->
        <div class="sticky top-0 left-0 w-full h-screen z-0 pointer-events-none">
            <canvas id="scroll-canvas-2" class="w-full h-full object-cover"></canvas>
        </div>

        <!-- Foreground Content Layer -->
        <div class="relative z-10 w-full flex flex-col justify-between" style="min-height: 180vh; margin-top: -100vh;">
            <div data-include="components/teardown-intro.html"></div>
            <div data-include="components/features-two.html"></div>
            <div data-include="components/telemetry-cta.html"></div>
            <div data-include="components/footer.html"></div>
        </div>
    </div>

    <!-- Modular Loader & Canvas Scroll Engine -->
    <script src="assets/js/main.js"></script>
</body>

</html>
