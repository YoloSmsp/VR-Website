<!-- Main Hero Section -->
<main class="w-full px-4 sm:px-6 md:px-8 flex items-start pt-12 sm:pt-16 pb-8 pointer-events-auto">
    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <!-- Left: Headline & Model Selector -->
        <div class="lg:col-span-6 flex flex-col justify-start space-y-8 sm:space-y-10 z-10 pointer-events-auto">
            <div class="space-y-4 max-w-[640px]">
                <h1 class="text-5xl lg:text-7xl font-bold tracking-tight leading-[1.1] text-white">
                    <span class="block">
                        Your <span class="font-bold" style="color: transparent; -webkit-text-stroke: 1px white;">portal to</span>
                    </span>
                    <span class="block mt-2">
                        virtual <span class="font-bold" style="color: #ff6a00;">adventures</span>
                    </span>
                </h1>
                <p class="text-zinc-400 text-lg font-light leading-[1.6] max-w-[500px] pt-2">
                    Dive headfirst into a universe of potential. State-of-the-art VR, made for limitless immersion.
                </p>
            </div>
            <div class="pt-1">
                <button onclick="Cart.addToCart({id:'apex-cyber',name:'Apex Cyber VR Headset',price:2499,image:'assets/images/models/headset_model_a_1787642757913.jpg',tier:'Standard'});setTimeout(()=>location.href='cart.html',1200);" class="relative inline-flex items-center gap-3.5 px-8 py-4 text-xs font-semibold uppercase tracking-[0.2em] transition-all duration-300 transform hover:scale-[1.02] cursor-pointer shadow-2xl"
                    style="background-color: #ff6a00; color: #000; box-shadow: 0 8px 30px rgba(255, 106, 0, 0.4);">
                    <span class="font-bold tracking-[0.2em]">Pre-order now</span>
                    <svg class="w-4 h-4 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                </button>
                <a href="models.html" class="inline-flex items-center gap-2 ml-4 text-xs text-white/50 hover:text-white transition-colors" style="text-decoration:none;">Explore all models →</a>
            </div>

            <!-- Model Selector -->
            <div class="pt-4 sm:pt-6">
                <div class="relative flex items-center gap-4 sm:gap-6 pt-4 pb-2">
                    <div class="absolute top-1/2 left-8 right-8 h-[1px] bg-gradient-to-r from-orange-500/40 via-white/15 to-white/10 pointer-events-none -translate-y-3 z-0"></div>

                    <!-- Model 1: Apex Cyber (Selected) -->
                    <div class="relative z-10 flex flex-col items-center">
                        <button class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden cursor-pointer transition-all duration-300 flex items-center justify-center p-2 border-2 ring-2 shadow-lg bg-zinc-950/90"
                            style="border-color: #ff6a00; box-shadow: 0 0 25px rgba(255, 106, 0, 0.4);">
                            <img src="assets/images/models/headset_model_a_1787642757913.jpg" alt="Apex Cyber"
                                class="w-full h-full object-contain filter drop-shadow-md rounded-lg">
                            <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full shadow-[0_0_8px_currentColor]"
                                style="background-color: #ff6a00; color: #ff6a00;"></span>
                        </button>
                        <div class="h-6 mt-2 flex items-center justify-center">
                            <span class="text-[0.65rem] font-bold uppercase tracking-[0.15em] px-2 py-0.5 rounded"
                                style="color: #ff6a00;">Selected</span>
                        </div>
                    </div>

                    <!-- Model 2: Mirage Glass -->
                    <div class="relative z-10 flex flex-col items-center">
                        <button class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden cursor-pointer transition-all duration-300 flex items-center justify-center p-2 border border-white/15 bg-zinc-950/60 hover:border-white/40 opacity-70 hover:opacity-100 hover:bg-zinc-900/80">
                            <img src="assets/images/models/headset_model_b_1787642783649.jpg" alt="Mirage Glass"
                                class="w-full h-full object-contain filter drop-shadow-md rounded-lg">
                        </button>
                        <div class="h-6 mt-2 flex items-center justify-center">
                            <span class="text-[0.65rem] uppercase tracking-[0.15em] text-zinc-500 font-medium">Mirage</span>
                        </div>
                    </div>

                    <!-- Model 3: Horizon Pulse -->
                    <div class="relative z-10 flex flex-col items-center">
                        <button class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden cursor-pointer transition-all duration-300 flex items-center justify-center p-2 border border-white/15 bg-zinc-950/60 hover:border-white/40 opacity-70 hover:opacity-100 hover:bg-zinc-900/80">
                            <img src="assets/images/models/headset_model_c_1787642797135.jpg" alt="Horizon Pulse"
                                class="w-full h-full object-contain filter drop-shadow-md rounded-lg">
                        </button>
                        <div class="h-6 mt-2 flex items-center justify-center">
                            <span class="text-[0.65rem] uppercase tracking-[0.15em] text-zinc-500 font-medium">Horizon</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Hero Visual Artwork -->
        <div class="lg:col-span-6 flex items-center justify-center relative pointer-events-auto">
            <div class="relative w-full h-full min-h-[460px] sm:min-h-[560px] lg:min-h-[640px] flex items-center justify-center">
                <img src="assets/images/models/vr_hero_black_1787642741092.jpg" alt="VR Headset Hero"
                    class="w-full max-h-[620px] object-contain drop-shadow-[0_25px_45px_rgba(0,0,0,0.18)]">

                <!-- Inspect Button -->
                <div class="absolute bottom-4 right-4 sm:bottom-6 sm:right-6 z-20">
                    <button class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-zinc-950/90 hover:bg-zinc-900 border border-white/20 hover:border-white/50 backdrop-blur-md flex items-center justify-center text-white shadow-xl cursor-pointer transition-all duration-200">
                        <svg class="w-5 h-5" style="color: #ff6a00;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
                            <path d="M5 3v4"></path>
                            <path d="M19 17v4"></path>
                            <path d="M3 5h4"></path>
                            <path d="M17 19h4"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
